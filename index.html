<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <!-- =================================
         PANTALLA DE AUTENTICACIÓN
    ================================== -->

    <div
        id="authScreen"
        class="auth-screen"
    >

        <div class="auth-box">

            <div class="logo">
                💬
            </div>

            <h1>
                Chat
            </h1>

            <p class="subtitle">
                Tu chat privado
            </p>


            <!-- =============================
                 LOGIN
            ============================== -->

            <div id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                >

                <button
                    id="loginButton"
                    type="button"
                >
                    Iniciar sesión
                </button>


                <p>

                    ¿No tienes cuenta?

                    <button
                        id="showRegister"
                        class="link-button"
                        type="button"
                    >
                        Registrarme
                    </button>

                </p>

            </div>


            <!-- =============================
                 REGISTRO
            ============================== -->

            <div
                id="registerForm"
                class="hidden"
            >

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                >

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Nombre de usuario"
                    autocomplete="username"
                    maxlength="20"
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Contraseña"
                    autocomplete="new-password"
                >

                <button
                    id="registerButton"
                    type="button"
                >
                    Crear cuenta
                </button>


                <p>

                    ¿Ya tienes cuenta?

                    <button
                        id="showLogin"
                        class="link-button"
                        type="button"
                    >
                        Iniciar sesión
                    </button>

                </p>

            </div>


            <div id="authMessage"></div>

        </div>

    </div>



    <!-- =================================
         APLICACIÓN
    ================================== -->

    <div
        id="app"
        class="app hidden"
    >


        <!-- =================================
             BARRA LATERAL
        ================================== -->

        <aside class="sidebar">


            <!-- CABECERA -->

            <div class="sidebar-header">

                <div>

                    <h2>
                        Chat
                    </h2>

                    <span id="currentUser"></span>

                </div>


                <button
                    id="logoutButton"
                    type="button"
                    title="Cerrar sesión"
                >
                    ↪
                </button>

            </div>



            <!-- BUSCADOR -->

            <div class="search">

                <input
                    id="userSearch"
                    type="text"
                    placeholder="Buscar usuarios..."
                    autocomplete="off"
                >

            </div>


            <!-- RESULTADOS DE BÚSQUEDA -->

            <div id="searchResults"></div>



            <!-- CREAR GRUPO -->

            <button
                id="createGroupButton"
                class="create-group-button"
                type="button"
            >
                👥 Crear grupo
            </button>



            <!-- TÍTULO CHATS -->

            <div class="section-title">
                MIS CHATS
            </div>



            <!-- LISTA DE CHATS -->

            <div id="chatList"></div>


        </aside>



        <!-- =================================
             ZONA PRINCIPAL DEL CHAT
        ================================== -->

        <main class="chat">


            <!-- =============================
                 PANTALLA DE BIENVENIDA
            ============================== -->

            <div
                id="welcome"
                class="welcome"
            >

                <div class="welcome-icon">
                    💬
                </div>

                <h2>
                    Bienvenido a Chat
                </h2>

                <p>
                    Selecciona un chat para empezar a hablar.
                </p>

            </div>



            <!-- =============================
                 VENTANA DEL CHAT
            ============================== -->

            <div
                id="chatWindow"
                class="chat-window hidden"
            >


                <!-- CABECERA DEL CHAT -->

                <header class="chat-header">


                    <div>

                        <div id="chatTitle">
                            Chat
                        </div>

                        <small id="chatStatus"></small>

                    </div>


                    <!-- ELIMINAR CHAT -->

                    <button
                        id="deleteChatButton"
                        type="button"
                        title="Eliminar chat"
                    >
                        🗑️
                    </button>


                </header>



                <!-- =============================
                     MENSAJES
                ============================== -->

                <div
                    id="messages"
                    class="messages"
                ></div>



                <!-- =============================
                     ESCRIBIR MENSAJE
                ============================== -->

                <div class="message-area">


                    <div class="message-input-wrapper">


                        <input
                            id="messageInput"
                            type="text"
                            placeholder="Escribe un mensaje..."
                            autocomplete="off"
                            maxlength="1000"
                        >


                        <div
                            id="characterCounter"
                            class="character-counter"
                        >
                            0 / 1000
                        </div>


                    </div>



                    <button
                        id="sendButton"
                        type="button"
                        title="Enviar mensaje"
                    >
                        ➤
                    </button>


                </div>


            </div>


        </main>


    </div>



    <!-- =================================
         MODAL PARA CREAR GRUPO
    ================================== -->

    <div
        id="groupModal"
        class="modal hidden"
    >


        <div class="modal-box">


            <h2>
                👥 Crear grupo
            </h2>


            <!-- NOMBRE DEL GRUPO -->

            <input
                id="groupName"
                type="text"
                placeholder="Nombre del grupo"
                maxlength="30"
            >


            <p>
                Seleccioná los usuarios que querés agregar:
            </p>


            <!-- USUARIOS -->

            <div
                id="groupUsers"
                class="group-users"
            ></div>


            <!-- BOTONES -->

            <div class="modal-buttons">


                <button
                    id="cancelGroupButton"
                    type="button"
                >
                    Cancelar
                </button>


                <button
                    id="confirmGroupButton"
                    type="button"
                >
                    Crear grupo
                </button>


            </div>


        </div>


    </div>



    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script
        type="module"
        src="app.js"
    ></script>


</body>

</html>
