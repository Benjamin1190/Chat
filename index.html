<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       AUTENTICACIÓN
  ====================================================== -->

  <section id="authScreen" class="auth-screen">

    <div class="auth-box">

      <div class="auth-logo">
        💬
      </div>

      <h1>Chat</h1>

      <p class="auth-subtitle">
        Tu chat privado y grupos
      </p>


      <!-- LOGIN -->

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Correo electrónico"
          autocomplete="email"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        >

        <button
          id="loginButton"
          type="submit"
          class="primary-button"
        >
          Iniciar sesión
        </button>

        <button
          id="showRegister"
          type="button"
          class="secondary-button"
        >
          Crear cuenta
        </button>

      </form>


      <!-- REGISTRO -->

      <form id="registerForm" class="hidden">

        <input
          id="registerUsername"
          type="text"
          placeholder="Nombre de usuario"
          maxlength="30"
          autocomplete="username"
          required
        >

        <input
          id="registerEmail"
          type="email"
          placeholder="Correo electrónico"
          autocomplete="email"
          required
        >

        <input
          id="registerPassword"
          type="password"
          placeholder="Contraseña"
          autocomplete="new-password"
          required
        >

        <button
          id="registerButton"
          type="submit"
          class="primary-button"
        >
          Crear cuenta
        </button>

        <button
          id="showLogin"
          type="button"
          class="secondary-button"
        >
          Ya tengo una cuenta
        </button>

      </form>


      <div id="authMessage" class="auth-message"></div>

    </div>

  </section>


  <!-- =====================================================
       APLICACIÓN
  ====================================================== -->

  <main id="app" class="app hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <header class="sidebar-header">

        <div class="profile">

          <div class="avatar">
            👤
          </div>

          <div>
            <strong id="currentUser">
              Usuario
            </strong>

            <span>
              En línea
            </span>
          </div>

        </div>

        <div class="sidebar-actions">

          <button
            id="createGroupButton"
            title="Crear grupo"
          >
            👥
          </button>

          <button
            id="adminButton"
            class="hidden"
            title="Administración"
          >
            ⚙️
          </button>

          <button
            id="logoutButton"
            title="Cerrar sesión"
          >
            🚪
          </button>

        </div>

      </header>


      <!-- BUSCADOR -->

      <div class="search-box">

        <input
          id="userSearch"
          type="text"
          placeholder="Buscar usuario..."
          autocomplete="off"
        >

      </div>


      <div
        id="searchResults"
        class="search-results hidden"
      ></div>


      <!-- LISTA DE CHATS -->

      <div
        id="chatList"
        class="chat-list"
      ></div>

    </aside>


    <!-- CHAT -->

    <section class="chat-area">

      <!-- BIENVENIDA -->

      <div id="welcome" class="welcome">

        <div class="welcome-icon">
          💬
        </div>

        <h2>Bienvenido a Chat</h2>

        <p>
          Seleccioná una conversación para comenzar.
        </p>

      </div>


      <!-- VENTANA DE CHAT -->

      <div
        id="chatWindow"
        class="chat-window hidden"
      >

        <!-- HEADER -->

        <header class="chat-header">

          <div>

            <h2 id="chatTitle">
              Chat
            </h2>

            <span id="chatStatus"></span>

          </div>

          <button
            id="deleteChatButton"
            title="Eliminar conversación"
          >
            🗑️
          </button>

        </header>


        <!-- MENSAJES -->

        <div
          id="messages"
          class="messages"
        ></div>


        <!-- ESCRIBIR -->

        <div class="message-area">

          <div
            id="imagePreview"
            class="image-preview hidden"
          >
            <img id="imagePreviewThumb" alt="Vista previa">
            <button
              id="removeImageButton"
              type="button"
              title="Quitar imagen"
            >
              ✕
            </button>
          </div>

          <textarea
            id="messageInput"
            maxlength="4000"
            rows="1"
            placeholder="Escribí un mensaje..."
          ></textarea>

          <input
            id="imageInput"
            type="file"
            accept="image/*"
            class="hidden"
          >

          <div class="message-bottom">

            <button
              id="attachButton"
              type="button"
              title="Enviar imagen"
            >
              🖼️
            </button>

            <span id="characterCounter">
              0/4000
            </span>

            <button
              id="sendButton"
              class="send-button"
            >
              ➤
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       MODAL CREAR GRUPO
  ====================================================== -->

  <div
    id="groupModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <h2>Crear grupo</h2>

      <input
        id="groupName"
        type="text"
        maxlength="50"
        placeholder="Nombre del grupo"
      >

      <h3>Agregar personas</h3>

      <div
        id="groupUsers"
        class="group-users"
      ></div>

      <div class="modal-buttons">

        <button
          id="cancelGroupButton"
          class="secondary-button"
          type="button"
        >
          Cancelar
        </button>

        <button
          id="confirmGroupButton"
          class="primary-button"
          type="button"
        >
          Crear grupo
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ADMIN
  ====================================================== -->

  <div
    id="adminPanel"
    class="admin-panel hidden"
  >

    <div class="admin-box">

      <header class="admin-header">

        <div>
          <h2>Administración</h2>

          <span id="adminUserCount">
            0 usuarios
          </span>
        </div>

        <button id="adminCloseButton">
          ✕
        </button>

      </header>


      <div class="admin-toolbar">

        <input
          id="adminSearch"
          type="text"
          placeholder="Buscar usuario..."
        >

        <button
          id="adminSyncButton"
        >
          🔄 Sincronizar
        </button>

      </div>


      <div
        id="adminSyncStatus"
        class="admin-sync-status"
      ></div>


      <div class="admin-content">

        <div class="admin-users">

          <div
            id="adminUsers"
            class="admin-user-list"
          ></div>

          <div
            id="adminEmpty"
            class="admin-empty hidden"
          >
            No se encontraron usuarios.
          </div>

        </div>


        <div
          id="adminDetails"
          class="admin-details hidden"
        >

          <div class="admin-user-info">

            <h2 id="adminDetailName">
              Usuario
            </h2>

            <p>
              <strong>Email:</strong>
              <span id="adminDetailEmail"></span>
            </p>

            <p>
              <strong>UID:</strong>
              <span id="adminDetailUid"></span>
            </p>

            <p>
              <strong>Creado:</strong>
              <span id="adminDetailCreated"></span>
            </p>

          </div>


          <h3>
            Historial de conversaciones
          </h3>

          <div
            id="adminHistory"
            class="admin-history"
          ></div>

        </div>

      </div>

    </div>

  </div>


  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
