<div id="authScreen" class="auth-screen">
    <div class="auth-box">

        <div class="logo">💬</div>

        <h1>Chat</h1>
        <p class="subtitle">Tu chat privado</p>

        <div id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Correo electrónico"
                autocomplete="email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Contraseña"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Iniciar sesión
            </button>

            <p>
                ¿No tienes cuenta?
                <button class="link-button" id="showRegister">
                    Registrarme
                </button>
            </p>

        </div>

        <div id="registerForm" class="hidden">

            <input
                id="registerEmail"
                type="email"
                placeholder="Correo electrónico"
                autocomplete="email"
            >

            <input
                id="registerUsername"
                type="text"
                placeholder="Nombre de usuario"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Contraseña"
                autocomplete="new-password"
            >

            <button id="registerButton">
                Crear cuenta
            </button>

            <p>
                ¿Ya tienes cuenta?
                <button class="link-button" id="showLogin">
                    Iniciar sesión
                </button>
            </p>

        </div>

        <div id="authMessage"></div>

    </div>
</div>
