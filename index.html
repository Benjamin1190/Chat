<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         AUTENTICACIÓN
    ========================== -->

    <div id="authScreen" class="auth-screen">

        <div class="auth-box">

            <div class="logo">💬</div>

            <h1>Chat</h1>

            <p class="subtitle">
                Inicia sesión para continuar
            </p>


            <!-- LOGIN -->

            <div id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                >

                <button id="loginButton">
                    Iniciar sesión
                </button>

                <p>
                    ¿No tienes una cuenta?
                    <button
                        id="showRegister"
                        class="link-button"
                    >
                        Registrarte
                    </button>
                </p>

            </div>


            <!-- REGISTRO -->

            <div id="registerForm" class="hidden">

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Correo electrónico"
                    autocomplete="email"
                >

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Nombre de usuario"
                    maxlength="30"
                    autocomplete="username"
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Contraseña"
                    autocomplete="new-password"
                >

                <button id="registerButton">
                    Crear cuenta
                </button>

                <p>
                    ¿Ya tienes una cuenta?
                    <button
                        id="showLogin"
                        class="link-button"
                    >
                        Iniciar sesión
                    </button>
                </p>

            </div>


            <div id="authMessage"></div>

        </div>

    </div>


    <!-- =========================
         APLICACIÓN
    ========================== -->

    <div id="app" class="app hidden">


        <!-- =========================
             SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <div>
                    <h2>💬 Chat</h2>

                    <span id="currentUser">
                        @usuario
                    </span>
                </div>

                <button
                    id="logoutButton"
                    title="Cerrar sesión"
                >
                    🚪
                </button>

            </div>


            <!-- BUSCAR USUARIOS -->

            <div class="search">

                <input
                    id="userSearch"
                    type="text"
                    placeholder="Buscar usuario..."
                    autocomplete="off"
                >

            </div>


            <!-- RESULTADOS DE BÚSQUEDA -->

            <div id="searchResults"></div>


            <!-- CREAR GRUPO -->

            <button
                id="createGroupButton"
                class="create-group-button"
            >
                👥 Crear grupo
            </button>


            <div class="section-title">
                CHATS
            </div>


            <!-- LISTA DE CHATS -->

            <div id="chatList"></div>

        </aside>


        <!-- =========================
             CHAT
        ========================== -->

        <main class="chat">


            <!-- BIENVENIDA -->

            <div id="welcome" class="welcome">

                <div class="welcome-icon">
                    💬
                </div>

                <h2>
                    Bienvenido a Chat
                </h2>

                <p>
                    Busca un usuario para comenzar una conversación.
                </p>

            </div>


            <!-- VENTANA DEL CHAT -->

            <div
                id="chatWindow"
                class="chat-window hidden"
            >


                <!-- HEADER -->

                <div class="chat-header">

                    <div>

                        <div id="chatTitle">
                            Chat
                        </div>

                        <span id="chatStatus">
                            Chat privado
                        </span>

                    </div>


                    <button
                        id="deleteChatButton"
                        title="Eliminar chat"
                    >
                        🗑️
                    </button>

                </div>


                <!-- MENSAJES -->

                <div
                    id="messages"
                    class="messages"
                ></div>


                <!-- ESCRIBIR -->

                <div class="message-area">

                    <div class="message-input-wrapper">

                        <input
                            id="messageInput"
                            type="text"
                            maxlength="1000"
                            placeholder="Escribe un mensaje..."
                            autocomplete="off"
                        >

                        <span
                            id="characterCounter"
                            class="character-counter"
                        >
                            0 / 1000
                        </span>

                    </div>


                    <button
                        id="sendButton"
                        title="Enviar"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </main>

    </div>


    <!-- =========================
         MODAL CREAR GRUPO
    ========================== -->

    <div
        id="groupModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <h2>
                👥 Crear grupo
            </h2>


            <input
                id="groupName"
                type="text"
                placeholder="Nombre del grupo"
                maxlength="50"
            >


            <p>
                Selecciona los usuarios:
            </p>


            <div
                id="groupUsers"
                class="group-users"
            ></div>


            <div class="modal-buttons">

                <button id="cancelGroupButton">
                    Cancelar
                </button>

                <button id="confirmGroupButton">
                    Crear grupo
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="app.js"
    ></script>

</body>
</html>
