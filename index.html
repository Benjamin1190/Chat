<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ===================================== -->
<!-- PANTALLA DE AUTENTICACIÓN -->
<!-- ===================================== -->

<div
    id="authScreen"
    class="auth-screen"
>

    <div class="auth-box">

        <div class="logo">
            💬
        </div>

        <h1>
            Chat
        </h1>

        <p class="subtitle">
            Tu chat privado
        </p>


        <!-- ================================= -->
        <!-- LOGIN -->
        <!-- ================================= -->

        <div id="loginForm">

            <input
                id="loginEmail"
                type="email"
                placeholder="Correo electrónico"
                autocomplete="email"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="Contraseña"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Iniciar sesión
            </button>


            <p>

                ¿No tienes cuenta?

                <button
                    class="link-button"
                    id="showRegister"
                    type="button"
                >
                    Registrarme
                </button>

            </p>

        </div>


        <!-- ================================= -->
        <!-- REGISTRO -->
        <!-- ================================= -->

        <div
            id="registerForm"
            class="hidden"
        >

            <input
                id="registerEmail"
                type="email"
                placeholder="Correo electrónico"
                autocomplete="email"
            >

            <input
                id="registerUsername"
                type="text"
                placeholder="Nombre de usuario"
                autocomplete="username"
                maxlength="20"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="Contraseña"
                autocomplete="new-password"
            >

            <button id="registerButton">
                Crear cuenta
            </button>


            <p>

                ¿Ya tienes cuenta?

                <button
                    class="link-button"
                    id="showLogin"
                    type="button"
                >
                    Iniciar sesión
                </button>

            </p>

        </div>


        <!-- MENSAJES DE AUTENTICACIÓN -->

        <div id="authMessage"></div>

    </div>

</div>



<!-- ===================================== -->
<!-- APLICACIÓN -->
<!-- ===================================== -->

<div
    id="app"
    class="app hidden"
>


    <!-- ================================= -->
    <!-- BARRA LATERAL -->
    <!-- ================================= -->

    <aside class="sidebar">


        <!-- CABECERA -->

        <div class="sidebar-header">

            <div>

                <h2>
                    Chat
                </h2>

                <span id="currentUser"></span>

            </div>


            <button
                id="logoutButton"
                title="Cerrar sesión"
                type="button"
            >
                ↪
            </button>

        </div>



        <!-- ================================= -->
        <!-- BUSCADOR -->
        <!-- ================================= -->

        <div class="search">

            <input
                id="userSearch"
                type="text"
                placeholder="Buscar usuarios..."
                autocomplete="off"
            >

        </div>


        <!-- RESULTADOS DE BÚSQUEDA -->

        <div
            id="searchResults"
            class="hidden"
        ></div>



        <!-- ================================= -->
        <!-- LISTA DE CHATS -->
        <!-- ================================= -->

        <div class="section-title">
            MIS CHATS
        </div>


        <div id="chatList"></div>


    </aside>



    <!-- ================================= -->
    <!-- ÁREA PRINCIPAL DEL CHAT -->
    <!-- ================================= -->

    <main class="chat">


        <!-- ================================= -->
        <!-- BIENVENIDA -->
        <!-- ================================= -->

        <div
            id="welcome"
            class="welcome"
        >

            <div class="welcome-icon">
                💬
            </div>

            <h2>
                Bienvenido a Chat
            </h2>

            <p>
                Selecciona un chat para empezar a hablar.
            </p>

        </div>



        <!-- ================================= -->
        <!-- VENTANA DEL CHAT -->
        <!-- ================================= -->

        <div
            id="chatWindow"
            class="chat-window hidden"
        >


            <!-- CABECERA DEL CHAT -->

            <header class="chat-header">

                <div>

                    <div id="chatTitle">
                        Chat
                    </div>

                    <small id="chatStatus"></small>

                </div>

            </header>



            <!-- ================================= -->
            <!-- MENSAJES -->
            <!-- ================================= -->

            <div
                id="messages"
                class="messages"
            ></div>



            <!-- ================================= -->
            <!-- ÁREA PARA ESCRIBIR -->
            <!-- ================================= -->

            <div class="message-area">


                <!-- INPUT DE IMAGEN -->

                <input
                    id="imageInput"
                    type="file"
                    accept="image/*"
                    hidden
                >


                <!-- BOTÓN IMAGEN -->

                <button
                    id="imageButton"
                    title="Enviar imagen"
                    type="button"
                >
                    📷
                </button>


                <!-- MENSAJE -->

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                >


                <!-- ENVIAR -->

                <button
                    id="sendButton"
                    type="button"
                >
                    ➤
                </button>


            </div>


        </div>


    </main>


</div>



<!-- ===================================== -->
<!-- SUPABASE -->
<!-- ===================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- ===================================== -->
<!-- JAVASCRIPT DE LA APP -->
<!-- ===================================== -->

<script
    src="app.js"
    defer
></script>


</body>

</html>
